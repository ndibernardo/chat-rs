apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-worker
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "chat-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.chatWorker.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "chat-rs.selectorLabels" (dict "root" $ "workload" "chat-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat-rs.selectorLabels" (dict "root" $ "workload" "chat-worker") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- include "chat-rs.topologySpreadConstraints" (dict "root" $ "workload" "chat-worker") | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: chat-worker
          image: "{{ .Values.images.chat.repository }}:{{ .Values.images.chat.tag }}"
          imagePullPolicy: {{ .Values.images.chat.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3002
            - name: metrics
              containerPort: 9090
          env:
            - name: SERVICE_ROLE
              value: worker
            {{- include "chat-rs.commonEnv" . | nindent 12 }}
            {{- include "chat-rs.chatCoreEnv" . | nindent 12 }}
            # The worker role never opens the JWT key (see
            # bootstrap/worker.rs — it never calls build_adapters), but
            # Config::load still requires the env var to be set. Mounted
            # anyway for consistency with chat-api/chat-ws-gateway — it's
            # public key material, so there's no risk in doing so.
            - name: JWT__PUBLIC_KEY_PATH
              value: /etc/chat-rs/jwt/jwt_ed25519.pub.pem
          volumeMounts:
            - name: jwt-public-key
              mountPath: /etc/chat-rs/jwt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: 3002
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3002
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /livez
              port: 3002
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.chatWorker.resources | nindent 12 }}
      volumes:
        - name: jwt-public-key
          configMap:
            name: jwt-public-key
