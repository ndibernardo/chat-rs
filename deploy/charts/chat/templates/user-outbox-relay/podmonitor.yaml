{{- if .Values.monitoring.enabled }}
# PodMonitor, not ServiceMonitor: the relay serves no traffic and has no
# Service — Prometheus scrapes the pod's metrics port directly.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: user-outbox-relay
  labels:
    {{- include "chat.labels" (dict "root" $ "workload" "user-outbox-relay") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chat.selectorLabels" (dict "root" $ "workload" "user-outbox-relay") | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
{{- end }}
