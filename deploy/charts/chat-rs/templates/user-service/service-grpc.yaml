# Headless: gives tonic client-side round-robin over the pod IPs returned by
# DNS instead of pinning one backend per long-lived gRPC connection, which is
# what a normal ClusterIP Service would do.
apiVersion: v1
kind: Service
metadata:
  name: user-service-grpc
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "user-service") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "chat-rs.selectorLabels" (dict "root" $ "workload" "user-service") | nindent 4 }}
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
