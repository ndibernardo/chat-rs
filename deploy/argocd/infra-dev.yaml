apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-infra-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ndibernardo/chat.git
    targetRevision: main
    path: deploy/charts/chat-infra
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: chat
  syncPolicy:
    automated:
      prune: true
      # Off, not on: selfHeal would revert scripts/k8s/dev-verify.sh's
      # `kubectl rollout restart` drill back to the last-synced state mid-run.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
