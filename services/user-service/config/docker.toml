# Docker environment configuration
# Uses Docker service names for inter-container communication

[database]
url = "postgresql://postgres:postgres@postgres:5432/user"
max_connections = 5

[server]
http_port = 3001
grpc_port = 50051
metrics_port = 9090

[jwt]
private_key_path = "/app/keys/dev/jwt_ed25519.pem"
public_key_path = "/app/keys/dev/jwt_ed25519.pub.pem"
expiration_hours = 24

[cors]
allowed_origins = ["http://localhost:5173"]

[kafka]
brokers = "kafka:29092"
topic = "user-events"

[shutdown]
readiness_delay_seconds = 5

[outbox]
poll_interval_ms = 500
batch_size = 100
retention_days = 7
