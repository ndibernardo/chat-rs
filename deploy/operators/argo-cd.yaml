# argo/argo-cd 10.1.3 (https://argoproj.github.io/argo-helm)
dex:
  # No SSO — one committed dev-grade admin login is enough for a local
  # kind cluster, and dex adds a pod plus an OIDC config surface for nothing.
  enabled: false

notifications:
  enabled: false

applicationSet:
  # This chart version has no enable flag for the controller — zeroing
  # replicas is how you turn it off. Nothing in this repo defines an
  # ApplicationSet; the five Applications are plain, hand-written manifests.
  replicas: 0

configs:
  params:
    # No TLS cert to serve here — access stays behind kubectl port-forward,
    # never a public endpoint, so plaintext behind the tunnel is fine.
    server.insecure: true
