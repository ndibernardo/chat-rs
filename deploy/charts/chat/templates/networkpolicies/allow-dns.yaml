{{- if .Values.networkPolicies.enabled }}
# Every pod resolves Service names via CoreDNS in kube-system — without
# this, default-deny egress blocks DNS and nothing else in this namespace
# can reach anything, including the policies below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    {{- include "chat.labels" (dict "root" $ "workload" "allow-dns") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
