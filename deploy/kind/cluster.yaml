# Single control-plane node: this cluster hosts operators (Strimzi, Scylla,
# CNPG, kube-prometheus-stack) plus the app, not a multi-node HA scenario.
# Access is via kubectl port-forward, so no extraPortMappings either.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: chat-rs
nodes:
  - role: control-plane

# Calico fallback — uncomment only if a canary test shows kindnet (the
# default CNI) does not enforce NetworkPolicy on this kind/Docker combo.
# networking:
#   disableDefaultCNI: true
