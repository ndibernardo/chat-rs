{{- if not .Values.jwt.publicKey -}}
{{- fail "jwt.publicKey is required — pass via --set-file jwt.publicKey=<path-to-pub.pem> (scripts/k8s/dev-up.sh does this for the dev keypair)" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: jwt-public-key
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "user-service") | nindent 4 }}
data:
  jwt_ed25519.pub.pem: |
    {{- .Values.jwt.publicKey | nindent 4 }}
