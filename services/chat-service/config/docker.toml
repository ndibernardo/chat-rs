# Docker environment configuration
# Uses Docker service names for inter-container communication

[database]
url = "postgresql://postgres:postgres@postgres:5432/chat"
max_connections = 5

[jwt]
public_key_path = "/app/keys/dev/jwt_ed25519.pub.pem"

[cors]
allowed_origins = ["http://localhost:5173"]

[cassandra]
nodes = ["cassandra:9042"]
keyspace = "chat"

[server]
http_port = 3002
metrics_port = 9090

[user_service]
grpc_url = "http://user-service:50051"

[kafka]
brokers = "kafka:29092"
group_id = "chat-service-group"
messages_topic = "chat.messages"
delivery_timeout_ms = 10000

[kafka.user_events]
topic = "user-events"
group_id = "chat-service-user-events"

[kafka.cleanup]
group_id = "chat-cleanup"

[websocket]
send_queue_capacity = 256

[shutdown]
readiness_delay_seconds = 5
drain_grace_seconds = 30

[outbox]
poll_interval_ms = 500
batch_size = 100
retention_days = 7
