[workspace]
resolver = "3"
members = ["crates/auth", "crates/web", "services/user-service", "services/chat-service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ndibernardo"]

[workspace.dependencies]
# gRPC and Protocol Buffers
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database - PostgreSQL
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }

# Database - Cassandra
scylla = { version = "1.7", features = ["chrono-04"] }

# Types
uuid = { version = "1.6", features = ["v1", "v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Email
email_address = "0.2.4"

# Async trait
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.15"

# Password hashing
argon2 = { version = "0.5", features = ["std"] }
zeroize = { version = "1.8", features = ["derive"] }

# JWT for auth
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Kafka
rdkafka = { version = "0.39", features = ["cmake-build"] }

# CLI argument parsing (role selection, --migrate-only)
clap = { version = "4", features = ["derive", "env"] }
