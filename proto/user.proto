syntax = "proto3";

package user;

// Internal User service RPC for inter-service communication
service UserService {
  // Get user by ID (used by chat-service for internal user data).
  // Absence and failure are distinguished via gRPC status codes: NOT_FOUND
  // means the user genuinely does not exist; any other error status means
  // the call itself failed (retryable).
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

// Messages

message User {
  string id = 1;           // UUID as string
  string username = 2;
  string email = 3;
  string created_at = 4;   // RFC3339 timestamp
}

message GetUserRequest {
  string user_id = 1;      // UUID as string
}

message GetUserResponse {
  User user = 1;
}