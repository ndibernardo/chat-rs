apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "user-service") | nindent 4 }}
spec:
  # Omitted, not defaulted, when the HPA owns this field — reasserting a
  # static replica count on every helm upgrade would fight the HPA's own
  # scaling decisions.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.userService.replicas }}
  {{- end }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "chat-rs.selectorLabels" (dict "root" $ "workload" "user-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat-rs.selectorLabels" (dict "root" $ "workload" "user-service") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- include "chat-rs.topologySpreadConstraints" (dict "root" $ "workload" "user-service") | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-service
          image: "{{ .Values.images.user.repository }}:{{ .Values.images.user.tag }}"
          imagePullPolicy: {{ .Values.images.user.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3001
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          env:
            - name: SERVICE_ROLE
              value: server
            {{- include "chat-rs.commonEnv" . | nindent 12 }}
            {{- include "chat-rs.userCoreEnv" . | nindent 12 }}
            - name: JWT__PRIVATE_KEY_PATH
              value: /etc/chat-rs/jwt-priv/jwt_ed25519.pem
            - name: JWT__PUBLIC_KEY_PATH
              value: /etc/chat-rs/jwt/jwt_ed25519.pub.pem
          volumeMounts:
            - name: jwt-private-key
              mountPath: /etc/chat-rs/jwt-priv
              readOnly: true
            - name: jwt-public-key
              mountPath: /etc/chat-rs/jwt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: 3001
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /livez
              port: 3001
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              # Gives the endpoint controller time to remove this pod from
              # the Service before the container actually stops accepting
              # connections, avoiding a burst of connection-refused errors.
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
      volumes:
        - name: jwt-private-key
          secret:
            secretName: jwt-signing-key
        - name: jwt-public-key
          configMap:
            name: jwt-public-key
