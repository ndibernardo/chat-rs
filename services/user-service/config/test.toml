# Test environment configuration for docker-compose.test.yml

[database]
url = "postgresql://postgres:postgres@postgres-test:5432/user"
max_connections = 5

[server]
http_port = 3000
grpc_port = 50051
metrics_port = 9090

[jwt]
private_key_path = "/app/keys/dev/jwt_ed25519.pem"
public_key_path = "/app/keys/dev/jwt_ed25519.pub.pem"
expiration_hours = 24

[cors]
allowed_origins = ["http://localhost:5173"]

[kafka]
brokers = "kafka-test:29092"
topic = "user-events-test"
