{{- if .Values.ingress.enabled -}}
{{- if not .Values.ingress.host -}}
{{- fail "ingress.host is required when ingress.enabled — set it in values-<env>.yaml (e.g. chat.dev.local)" -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-rs-http
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "ingress-http") | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # user-service: auth + user CRUD.
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3001
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3001
          # chat-api: channel + message-history CRUD.
          - path: /api/channels
            pathType: Prefix
            backend:
              service:
                name: chat-api
                port:
                  number: 3002
{{- end }}
