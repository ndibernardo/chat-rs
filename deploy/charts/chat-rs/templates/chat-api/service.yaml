apiVersion: v1
kind: Service
metadata:
  name: chat-api
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "chat-api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chat-rs.selectorLabels" (dict "root" $ "workload" "chat-api") | nindent 4 }}
  ports:
    - name: http
      port: 3002
      targetPort: http
    # Named here so the ServiceMonitor can target the port by name.
    - name: metrics
      port: 9090
      targetPort: metrics
