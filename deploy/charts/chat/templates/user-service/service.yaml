apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    {{- include "chat.labels" (dict "root" $ "workload" "user-service") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chat.selectorLabels" (dict "root" $ "workload" "user-service") | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: http
    # Named here so the ServiceMonitor can target the port by name.
    - name: metrics
      port: 9090
      targetPort: metrics
