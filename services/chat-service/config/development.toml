# Development environment configuration

[database]
url = "postgresql://postgres:postgres@localhost:5432/chat"
max_connections = 5

[jwt]
public_key_path = "../../keys/dev/jwt_ed25519.pub.pem"

[cors]
allowed_origins = ["http://localhost:5173"]

[cassandra]
nodes = ["localhost:9042"]
keyspace = "chat"

[server]
http_port = 3002
metrics_port = 9090

[user_service]
grpc_url = "http://localhost:50051"

[kafka]
brokers = "localhost:9092"
group_id = "chat-service-group"
messages_topic = "chat.messages"
delivery_timeout_ms = 10000

[kafka.user_events]
topic = "user-events"
group_id = "chat-service-user-events"

[websocket]
send_queue_capacity = 256
