apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-app-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ndibernardo/chat.git
    targetRevision: main
    path: deploy/charts/chat
    helm:
      valueFiles:
        - values-staging.yaml
      # Same unverified path-escape as chat-app-dev — see that
      # Application for the fallback if Argo mishandles it.
      fileParameters:
        - name: jwt.privateKey
          path: ../../../keys/staging/jwt_ed25519.pem
        - name: jwt.publicKey
          path: ../../../keys/staging/jwt_ed25519.pub.pem
  destination:
    server: https://kubernetes.default.svc
    namespace: chat-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
