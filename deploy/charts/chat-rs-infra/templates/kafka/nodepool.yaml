# Single dual-role pool (controller + broker on every node) fits dev's
# single-node budget; prod would split into dedicated controller and broker
# KafkaNodePools instead of scaling this one.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: {{ .Values.kafka.clusterName }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage }}
        deleteClaim: {{ .Values.kafka.deleteClaim }}
