{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ws
  labels:
    {{- include "chat.labels" (dict "root" $ "workload" "ingress-ws") | nindent 4 }}
  annotations:
    # nginx's default proxy timeout is 60s; a held-open WS connection needs
    # to outlive chat-ws-gateway's own shutdown/drain window during a
    # rolling restart, or nginx cuts it before the app gets a chance to.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # See chat-http's Ingress for why: without this, port 80 redirects to
    # 443 and the verify scripts' plain `ws://` connections never land.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: chat-ws-gateway
                port:
                  number: 3002
{{- end }}
