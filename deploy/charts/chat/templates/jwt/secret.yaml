{{- if .Values.jwt.create -}}
{{- if not .Values.jwt.privateKey -}}
{{- fail "jwt.privateKey is required — pass via --set-file jwt.privateKey=<path-to-pem> (scripts/k8s/dev-up.sh does this for the dev keypair)" -}}
{{- end -}}
# Private key mounts only into user-service — the asymmetric-JWT boundary:
# only the service that signs tokens needs the private half, every other
# verifier gets the public half from the jwt-public-key ConfigMap instead.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-signing-key
  labels:
    {{- include "chat.labels" (dict "root" $ "workload" "user-service") | nindent 4 }}
type: Opaque
stringData:
  jwt_ed25519.pem: |
    {{- .Values.jwt.privateKey | nindent 4 }}
{{- end }}
