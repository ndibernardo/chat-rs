{{- if .Values.networkPolicies.enabled }}
# Ingress: brokers accept client traffic on 9092 only from workloads that
# actually produce or consume — not from every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress-clients
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "allow-kafka") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: chat-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - user-service
                  - user-outbox-relay
                  - chat-api
                  - chat-ws-gateway
                  - chat-worker
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 9092
---
# Broker replication, the KRaft controller quorum, and the entity operator
# span several internal ports (9090/9091 control plane and more) — every
# peer here is already inside this selector, so a selector-scoped allow-all
# is the sane choice over chasing Strimzi's internal port list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-internal
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "allow-kafka") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: chat-kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: chat-kafka
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: chat-kafka
---
# The Strimzi cluster operator reconciles broker pods from its own
# namespace (config pushes, cert rotation) — not reachable via the app or
# broker selectors above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-ingress-operator
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "allow-kafka") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: chat-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: strimzi
---
# Egress mirror: default-deny blocks the client side independently of the
# broker-side ingress rule above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-egress-clients
  labels:
    {{- include "chat-rs.labels" (dict "root" $ "workload" "allow-kafka") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - user-service
          - user-outbox-relay
          - chat-api
          - chat-ws-gateway
          - chat-worker
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: chat-kafka
      ports:
        - protocol: TCP
          port: 9092
{{- end }}
